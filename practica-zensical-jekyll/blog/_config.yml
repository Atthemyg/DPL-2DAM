# Configuración del sitio
title: Entre Páginas
email: alumno@example.com
description: >-
  Reseñas de romance y romantasy: historias que no puedes soltar.
author: Alumno
lang: es
timezone: Atlantic/Canary

baseurl: "/blog"
url: "http://localhost"

# Tema y plugins
theme: minima
plugins:
  - jekyll-feed

# Opciones de Minima
minima:
  date_format: "%d/%m/%Y"
show_excerpts: true
excerpt_separator: "<!--more-->"

# Orden de las páginas en el menú superior
header_pages:
  - about.markdown
  - estanteria.markdown

# Excluidos del build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
