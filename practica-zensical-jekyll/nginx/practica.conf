server {
    listen 80;
    server_name localhost;

    location = /zensical { return 301 /zensical/; }
    location = /blog     { return 301 /blog/; }

    location /zensical/ {
        alias /var/www/zensical/;
        index index.html;
    }

    location /blog/ {
        alias /var/www/blog/;
        index index.html;
    }
}
